<svg width="1050" height="680" viewBox="0 0 1050 680" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="placeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pkgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="revGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="525" y="22" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Entity Relationship (ER) Diagram - Akole Tourism System</text>

  <!-- CONNECTING LINES WITH RELATIONSHIP LABELS -->
  <!-- USER -> BOOKING (1:N) -->
  <path d="M 270 130 L 530 130" stroke="#64748b" stroke-width="2.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <rect x="360" y="113" width="90" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="405" y="129" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1 : N (places)</text>

  <!-- TOURIST_PLACE -> TOUR_PACKAGE (1:N) -->
  <path d="M 160 390 L 160 460 L 530 460" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="290" y="445" width="100" height="24" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="340" y="461" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">1 : N (offers)</text>

  <!-- TOUR_PACKAGE -> BOOKING (1:N) -->
  <path d="M 640 380 L 640 275" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="585" y="310" width="110" height="24" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="640" y="326" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">1 : N (reserved in)</text>

  <!-- BOOKING -> PAYMENT (1:1) -->
  <path d="M 750 130 L 840 130" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="760" y="115" width="70" height="24" rx="4" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="795" y="131" font-size="11" font-weight="bold" fill="#be185d" text-anchor="middle">1 : 1 (has)</text>

  <!-- TOUR_PACKAGE -> REVIEW (1:N) -->
  <path d="M 750 500 L 840 500" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="760" y="485" width="75" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="797" y="501" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">1 : N (gets)</text>

  <!-- ENTITY 1: USER -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="220" height="235" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="50" y="40" width="220" height="40" rx="10" fill="url(#userGrad)"/>
    <rect x="50" y="70" width="220" height="10" fill="url(#userGrad)"/>
    <text x="160" y="65" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">USER</text>
    <text x="65" y="100" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String(UUID)</tspan></text>
    <text x="65" y="122" font-family="monospace" font-size="12" fill="#334155">    name <tspan fill="#64748b">: String</tspan></text>
    <text x="65" y="144" font-family="monospace" font-size="12" fill="#334155">    email <tspan fill="#64748b">: String (UQ)</tspan></text>
    <text x="65" y="166" font-family="monospace" font-size="12" fill="#334155">    mobile <tspan fill="#64748b">: String</tspan></text>
    <text x="65" y="188" font-family="monospace" font-size="12" fill="#334155">    password <tspan fill="#64748b">: String(Hash)</tspan></text>
    <text x="65" y="210" font-family="monospace" font-size="12" fill="#334155">    role <tspan fill="#64748b">: "ADMIN"|"USER"</tspan></text>
    <text x="65" y="232" font-family="monospace" font-size="12" fill="#334155">    status <tspan fill="#64748b">: "ACTIVE"|"BLOCKED"</tspan></text>
    <text x="65" y="254" font-family="monospace" font-size="12" fill="#334155">    createdAt <tspan fill="#64748b">: DateTime</tspan></text>
  </g>

  <!-- ENTITY 2: TOURIST_PLACE -->
  <g filter="url(#shadow)">
    <rect x="50" y="320" width="220" height="235" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="50" y="320" width="220" height="40" rx="10" fill="url(#placeGrad)"/>
    <rect x="50" y="350" width="220" height="10" fill="url(#placeGrad)"/>
    <text x="160" y="345" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TOURIST_PLACE</text>
    <text x="65" y="380" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String(UUID)</tspan></text>
    <text x="65" y="402" font-family="monospace" font-size="12" fill="#334155">    name <tspan fill="#64748b">: String</tspan></text>
    <text x="65" y="424" font-family="monospace" font-size="12" fill="#334155">    location <tspan fill="#64748b">: String</tspan></text>
    <text x="65" y="446" font-family="monospace" font-size="12" fill="#334155">    latitude <tspan fill="#64748b">: Float</tspan></text>
    <text x="65" y="468" font-family="monospace" font-size="12" fill="#334155">    longitude <tspan fill="#64748b">: Float</tspan></text>
    <text x="65" y="490" font-family="monospace" font-size="12" fill="#334155">    bestTimeToVisit <tspan fill="#64748b">: String</tspan></text>
    <text x="65" y="512" font-family="monospace" font-size="12" fill="#334155">    entryFee <tspan fill="#64748b">: Float</tspan></text>
    <text x="65" y="534" font-family="monospace" font-size="12" fill="#334155">    status <tspan fill="#64748b">: "ACTIVE"|"INACTIVE"</tspan></text>
  </g>

  <!-- ENTITY 3: TOUR_PACKAGE -->
  <g filter="url(#shadow)">
    <rect x="530" y="380" width="220" height="255" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="530" y="380" width="220" height="40" rx="10" fill="url(#pkgGrad)"/>
    <rect x="530" y="410" width="220" height="10" fill="url(#pkgGrad)"/>
    <text x="640" y="405" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TOUR_PACKAGE</text>
    <text x="545" y="440" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String(UUID)</tspan></text>
    <text x="545" y="462" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  placeId <tspan fill="#64748b" font-weight="normal">: String?</tspan></text>
    <text x="545" y="484" font-family="monospace" font-size="12" fill="#334155">    name <tspan fill="#64748b">: String</tspan></text>
    <text x="545" y="506" font-family="monospace" font-size="12" fill="#334155">    destination <tspan fill="#64748b">: String</tspan></text>
    <text x="545" y="528" font-family="monospace" font-size="12" fill="#334155">    duration <tspan fill="#64748b">: String</tspan></text>
    <text x="545" y="550" font-family="monospace" font-size="12" fill="#334155">    price <tspan fill="#64748b">: Float</tspan></text>
    <text x="545" y="572" font-family="monospace" font-size="12" fill="#334155">    maxPeople <tspan fill="#64748b">: Int</tspan></text>
    <text x="545" y="594" font-family="monospace" font-size="12" fill="#334155">    availableSeats <tspan fill="#64748b">: Int</tspan></text>
    <text x="545" y="616" font-family="monospace" font-size="12" fill="#334155">    status <tspan fill="#64748b">: "ACTIVE"|"INACTIVE"</tspan></text>
  </g>

  <!-- ENTITY 4: BOOKING -->
  <g filter="url(#shadow)">
    <rect x="530" y="40" width="220" height="235" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="530" y="40" width="220" height="40" rx="10" fill="url(#bookGrad)"/>
    <rect x="530" y="70" width="220" height="10" fill="url(#bookGrad)"/>
    <text x="640" y="65" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BOOKING</text>
    <text x="545" y="100" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String(UUID)</tspan></text>
    <text x="545" y="122" font-family="monospace" font-size="12" fill="#334155">    bookingId <tspan fill="#64748b">: String(UQ)</tspan></text>
    <text x="545" y="144" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  userId <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="545" y="166" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  packageId <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="545" y="188" font-family="monospace" font-size="12" fill="#334155">    numberOfPeople <tspan fill="#64748b">: Int</tspan></text>
    <text x="545" y="210" font-family="monospace" font-size="12" fill="#334155">    totalAmount <tspan fill="#64748b">: Float</tspan></text>
    <text x="545" y="232" font-family="monospace" font-size="12" fill="#334155">    status <tspan fill="#64748b">: "PENDING"|"CONFIRMED"</tspan></text>
    <text x="545" y="254" font-family="monospace" font-size="12" fill="#334155">    paymentStatus <tspan fill="#64748b">: "SUCCESS"|"PENDING"</tspan></text>
  </g>

  <!-- ENTITY 5: PAYMENT -->
  <g filter="url(#shadow)">
    <rect x="840" y="40" width="180" height="215" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="840" y="40" width="180" height="40" rx="10" fill="url(#payGrad)"/>
    <rect x="840" y="70" width="180" height="10" fill="url(#payGrad)"/>
    <text x="930" y="65" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PAYMENT</text>
    <text x="850" y="100" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="850" y="122" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  bookingId <tspan fill="#64748b" font-weight="normal">: UQ</tspan></text>
    <text x="850" y="144" font-family="monospace" font-size="12" fill="#334155">    amount <tspan fill="#64748b">: Float</tspan></text>
    <text x="850" y="166" font-family="monospace" font-size="12" fill="#334155">    method <tspan fill="#64748b">: String</tspan></text>
    <text x="850" y="188" font-family="monospace" font-size="12" fill="#334155">    txnId <tspan fill="#64748b">: String(UQ)</tspan></text>
    <text x="850" y="210" font-family="monospace" font-size="12" fill="#334155">    status <tspan fill="#64748b">: String</tspan></text>
    <text x="850" y="232" font-family="monospace" font-size="12" fill="#334155">    date <tspan fill="#64748b">: DateTime</tspan></text>
  </g>

  <!-- ENTITY 6: REVIEW -->
  <g filter="url(#shadow)">
    <rect x="840" y="400" width="180" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="840" y="400" width="180" height="40" rx="10" fill="url(#revGrad)"/>
    <rect x="840" y="430" width="180" height="10" fill="url(#revGrad)"/>
    <text x="930" y="425" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">REVIEW</text>
    <text x="850" y="460" font-family="monospace" font-size="12" fill="#ef4444" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="850" y="482" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  userId <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="850" y="504" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FK  packageId <tspan fill="#64748b" font-weight="normal">: String</tspan></text>
    <text x="850" y="526" font-family="monospace" font-size="12" fill="#334155">    rating <tspan fill="#64748b">: Int (1-5)</tspan></text>
    <text x="850" y="548" font-family="monospace" font-size="12" fill="#334155">    comment <tspan fill="#64748b">: Text</tspan></text>
    <text x="850" y="570" font-family="monospace" font-size="12" fill="#334155">    isApproved <tspan fill="#64748b">: Bool</tspan></text>
  </g>
</svg>
