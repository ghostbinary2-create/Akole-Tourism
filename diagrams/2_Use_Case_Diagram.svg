<svg width="1050" height="660" viewBox="0 0 1050 660" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="ucShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <text x="525" y="24" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">UML Use Case Diagram - Akole Tourism System</text>

  <!-- SYSTEM BOUNDARY -->
  <rect x="230" y="40" width="590" height="590" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="230" y="40" width="590" height="38" rx="16" fill="#f1f5f9"/>
  <text x="525" y="64" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">System Boundary: Akole Tourism &amp; Tour Management System</text>

  <!-- ACTOR 1: TOURIST / USER (LEFT) -->
  <g transform="translate(100, 180)">
    <circle cx="20" cy="20" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <line x1="20" y1="36" x2="20" y2="90" stroke="#2563eb" stroke-width="3"/>
    <line x1="20" y1="52" x2="-10" y2="70" stroke="#2563eb" stroke-width="3"/>
    <line x1="20" y1="52" x2="50" y2="70" stroke="#2563eb" stroke-width="3"/>
    <line x1="20" y1="90" x2="-5" y2="135" stroke="#2563eb" stroke-width="3"/>
    <line x1="20" y1="90" x2="45" y2="135" stroke="#2563eb" stroke-width="3"/>
    <text x="20" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Tourist / User</text>
    <text x="20" y="182" font-size="11" fill="#64748b" text-anchor="middle">(Registered Traveler)</text>
  </g>

  <!-- ACTOR 2: ADMIN (RIGHT) -->
  <g transform="translate(930, 180)">
    <circle cx="20" cy="20" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="36" x2="20" y2="90" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="52" x2="-10" y2="70" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="52" x2="50" y2="70" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="90" x2="-5" y2="135" stroke="#dc2626" stroke-width="3"/>
    <line x1="20" y1="90" x2="45" y2="135" stroke="#dc2626" stroke-width="3"/>
    <text x="20" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">System Admin</text>
    <text x="20" y="182" font-size="11" fill="#64748b" text-anchor="middle">(Operations Manager)</text>
  </g>

  <!-- ACTOR 3: PAYMENT GATEWAY (BOTTOM RIGHT) -->
  <g transform="translate(930, 470)">
    <rect x="-15" y="0" width="70" height="50" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/>
    <text x="20" y="30" font-size="18" text-anchor="middle">💳</text>
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Payment Gateway</text>
    <text x="20" y="85" font-size="11" fill="#64748b" text-anchor="middle">(Mock UPI/Card)</text>
  </g>

  <!-- USE CASE ELLIPSES & CONNECTORS -->
  <!-- UC1: Register & Login (Common) -->
  <g filter="url(#ucShadow)">
    <ellipse cx="525" cy="110" rx="110" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="525" y="115" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Register &amp; Authenticate (JWT)</text>
  </g>
  <line x1="140" y1="210" x2="420" y2="115" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="910" y1="210" x2="630" y2="115" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC2: Explore Places & Map -->
  <g filter="url(#ucShadow)">
    <ellipse cx="390" cy="180" rx="110" ry="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="390" y="185" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Explore Places &amp; Interactive Map</text>
  </g>
  <line x1="140" y1="230" x2="285" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC3: Search & Filter Packages -->
  <g filter="url(#ucShadow)">
    <ellipse cx="390" cy="250" rx="110" ry="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="390" y="255" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Search &amp; Filter Tour Packages</text>
  </g>
  <line x1="140" y1="245" x2="285" y2="250" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC4: Book Tour Package -->
  <g filter="url(#ucShadow)">
    <ellipse cx="390" cy="320" rx="110" ry="24" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="390" y="325" font-size="12" font-weight="bold" fill="#581c87" text-anchor="middle">Book Package &amp; Select Travelers</text>
  </g>
  <line x1="140" y1="260" x2="285" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC5: Make Online Payment -->
  <g filter="url(#ucShadow)">
    <ellipse cx="525" cy="390" rx="110" ry="24" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="525" y="395" font-size="12" font-weight="bold" fill="#831843" text-anchor="middle">Process Mock Online Payment</text>
  </g>
  <path d="M 455 340 L 490 370" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="500" y="350" font-size="10" fill="#be185d" font-weight="bold">&lt;&lt;include&gt;&gt;</text>
  <line x1="915" y1="495" x2="635" y2="400" stroke="#ec4899" stroke-width="1.5"/>

  <!-- UC6: Download Invoice / Receipt -->
  <g filter="url(#ucShadow)">
    <ellipse cx="390" cy="460" rx="110" ry="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="390" y="465" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">View / Print Booking Invoice</text>
  </g>
  <line x1="140" y1="280" x2="295" y2="450" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC7: Post Reviews & Ratings -->
  <g filter="url(#ucShadow)">
    <ellipse cx="390" cy="530" rx="110" ry="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="535" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Submit Review &amp; Star Ratings</text>
  </g>
  <line x1="140" y1="295" x2="305" y2="515" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ADMIN USE CASES -->
  <!-- UC8: Manage Places & Packages (CRUD) -->
  <g filter="url(#ucShadow)">
    <ellipse cx="660" cy="180" rx="110" ry="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="660" y="185" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Manage Places &amp; Packages (CRUD)</text>
  </g>
  <line x1="910" y1="230" x2="765" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC9: Manage & Confirm Bookings -->
  <g filter="url(#ucShadow)">
    <ellipse cx="660" cy="250" rx="110" ry="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="660" y="255" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Confirm / Cancel Bookings</text>
  </g>
  <line x1="910" y1="245" x2="765" y2="255" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC10: View Analytics Dashboard -->
  <g filter="url(#ucShadow)">
    <ellipse cx="660" cy="320" rx="110" ry="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="660" y="325" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Analytics &amp; Revenue Reports</text>
  </g>
  <line x1="910" y1="260" x2="765" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- UC11: Broadcast Notifications -->
  <g filter="url(#ucShadow)">
    <ellipse cx="660" cy="460" rx="110" ry="24" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="660" y="465" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Broadcast System Notifications</text>
  </g>
  <line x1="910" y1="280" x2="755" y2="450" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
